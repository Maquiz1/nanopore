{% extends 'base.html' %}
{% block content %}
<h2>{% if object %}Edit{% else %}Upload{% endif %} Manual</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save</button>
</form>
<a href="{% url 'documents:manual-list' %}">Back to list</a>
{% endblock %}

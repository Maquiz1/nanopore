{% extends 'base.html' %}

{% block content %}
<h2>Upload a User Manual</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Upload</button>
</form>

<a href="{% url 'documents:manual-list' %}">Back to Manuals</a>
{% endblock %}

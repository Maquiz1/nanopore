{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h3>Upload EDCS-TBLIS Zonal Lab CSV</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <!-- LAST UPLOAD INFO -->
    <div id="lastUploadInfo" class="mb-3"></div>

    <!-- ASYNC ERRORS WILL APPEAR HERE -->
    <div id="errorTableWrapper"></div>

    <div class="card p-3 shadow">
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.file.label_tag }}
            {{ form.file }}
            <div class="mt-2 d-flex gap-2">
                <button type="submit" class="btn btn-success" id="uploadBtn">Upload CSV</button>
                <button type="button" class="btn btn-danger" id="cancelBtn" style="display:none">Cancel Upload</button>
            </div>
        </form>

        <div class="progress mt-3" style="display:none" id="uploadProgressWrapper">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 id="uploadProgress"
                 style="width:0%">
                0%
            </div>
        </div>

        <!-- UPLOAD STATISTICS -->
        <div id="uploadStats" class="mt-3"></div>
    </div>
</div>

<script>
const uploadForm = document.getElementById("uploadForm");
const uploadProgressWrapper = document.getElementById("uploadProgressWrapper");
const uploadProgress = document.getElementById("uploadProgress");
const uploadBtn = document.getElementById("uploadBtn");
const cancelBtn = document.getElementById("cancelBtn");
const errorTableWrapper = document.getElementById("errorTableWrapper");
const lastUploadInfo = document.getElementById("lastUploadInfo");
const uploadStats = document.getElementById("uploadStats");

let intervalId = null;
let currentTaskId = null;

uploadForm.addEventListener("submit", function(e){
    e.preventDefault();

    uploadBtn.disabled = true;
    uploadBtn.innerText = "Uploading...";
    cancelBtn.style.display = "inline-block";
    errorTableWrapper.innerHTML = "";

    const xhr = new XMLHttpRequest();
    const formData = new FormData(this);

    xhr.upload.addEventListener("progress", function(event){
        if(event.lengthComputable){
            let percent = Math.round((event.loaded / event.total) * 100);
            uploadProgressWrapper.style.display = "block";
            uploadProgress.style.width = percent + "%";
            uploadProgress.innerText = percent + "%";
            uploadProgress.classList.add("uploading");
            uploadProgress.classList.remove("processing");
        }
    });

    xhr.open("POST", "", true);

    xhr.onload = function(){
        const data = JSON.parse(xhr.responseText);
        currentTaskId = data.task_id;
        const TASK_URL = "{% url 'nanopore:task-status' 'TASKID' %}".replace("TASKID", currentTaskId);

        // --- Poll for server-side processing ---
        intervalId = setInterval(()=>{
            fetch(TASK_URL)
                .then(r => r.json())
                .then(data => {
                    if(data.current && data.total){
                        let pct = Math.round((data.current / data.total) * 100);
                        uploadProgress.style.width = pct + "%";
                        uploadProgress.innerText = pct + "%";
                        uploadProgress.classList.remove("uploading");
                        uploadProgress.classList.add("processing");
                    }

                    if(data.state === "SUCCESS" || data.state === "REVOKED"){
                        clearInterval(intervalId);
                        uploadBtn.disabled = false;
                        cancelBtn.style.display = "none";
                        uploadProgressWrapper.style.display = "none";

                        // Rename button if errors exist
                        if(data.errors && data.errors.length){
                            uploadBtn.innerText = "Re-upload CSV";
                        } else {
                            uploadBtn.innerText = "Upload CSV";
                        }

                        // Show last upload info
                        let now = new Date();
                        lastUploadInfo.innerHTML = `
                            <strong>Last Upload:</strong> ${now.toLocaleString()}
                        `;

                        // // Show upload stats
                        // if(data.total_records_in_model){
                        //     let pct_total = Math.round((data.created / data.total_records_in_model) * 100);
                        //     uploadStats.innerHTML = `
                        //         <strong>Uploaded:</strong> ${data.created} / ${data.total_records_in_model} (${pct_total}%)
                        //     `;
                        // }
                        // Show upload stats
                        if(data.total_edcs_records !== undefined && data.total_tblis_records !== undefined){
                            uploadStats.innerHTML = `
                                <strong>EDCS Records:</strong> ${data.total_edcs_records} <br>
                                <strong>TBLIS Records:</strong> ${data.total_tblis_records} <br>
                                <strong>Uploaded %:</strong> ${data.percentage_uploaded}%
                            `;
                        }

                        if(data.state === "REVOKED"){
                            errorTableWrapper.innerHTML = `
                                <div class="alert alert-warning">Upload cancelled by user.</div>
                            `;
                            return;
                        }

                        // Show errors
                        if(data.errors && data.errors.length){
                            let html = `
                                <div class="alert alert-danger">
                                    <h5>Errors (${data.errors.length})</h5>
                                    <table class="table table-sm table-bordered">
                                        <thead><tr><th>#</th><th>Error</th></tr></thead>
                                        <tbody>
                            `;
                            data.errors.forEach((e,i)=>{
                                html += `<tr><td>${i+1}</td><td>${e}</td></tr>`;
                            });
                            html += "</tbody></table></div>";
                            errorTableWrapper.innerHTML = html;
                        } else {
                            errorTableWrapper.innerHTML = `
                                <div class="alert alert-success">
                                    Imported ${data.created} created / ${data.updated} updated
                                </div>
                            `;
                        }
                    }
                })
        }, 2000);
    };

    xhr.send(formData);
});

// Cancel button
cancelBtn.addEventListener("click", function(){
    if(currentTaskId){
        fetch("{% url 'nanopore:task-revoke' 'TASKID' %}".replace("TASKID", currentTaskId), {method:"POST"})
            .then(()=> {
                clearInterval(intervalId);
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Upload CSV";
                cancelBtn.style.display = "none";
                uploadProgressWrapper.style.display = "none";
                errorTableWrapper.innerHTML = `
                    <div class="alert alert-warning">Upload cancelled by user.</div>
                `;
            });
    }
});
</script>

<style>
#uploadProgress.uploading { background-color: #0d6efd; } /* blue upload */
#uploadProgress.processing { background-color: #198754; } /* green processing */
</style>

{% endblock %}

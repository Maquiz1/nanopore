{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Upload EDCS-TBLIS Zonal Lab CSV</h3>
        <a href="{% url 'nanopore:edcs-tblis-download-csv' %}"
           class="btn btn-outline-success"
           id="downloadBtn">
            ⬇️ Download All Data (CSV)
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <!-- LAST UPLOAD INFO -->
    <div id="lastUploadInfo" class="mb-3"></div>

    <!-- ASYNC ERRORS WILL APPEAR HERE -->
    <div id="errorTableWrapper"></div>

    <div class="card p-3 shadow">
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.file.label_tag }}
            {{ form.file }}
            <div class="mt-2 d-flex gap-2">
                <button type="submit" class="btn btn-success" id="uploadBtn">Upload CSV</button>
                <button type="button" class="btn btn-danger" id="cancelBtn" style="display:none">Cancel Upload</button>
            </div>
        </form>

        <div class="progress mt-3" style="display:none" id="uploadProgressWrapper">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 id="uploadProgress"
                 style="width:0%">
                0%
            </div>
        </div>

        <!-- UPLOAD STATISTICS -->
        <div id="uploadStats" class="mt-3"></div>
    </div>

    <!-- MERGE SUMMARY CARD (hidden until upload completes) -->
    <div id="mergeSummaryCard" class="card shadow mt-4" style="display:none">
        <div class="card-header bg-primary text-white fw-bold">📊 Upload Summary</div>
        <div class="card-body">
            <div class="row text-center g-3" id="mergeSummaryStats"></div>
            <div class="mt-3" id="mergeSummaryExtra"></div>
        </div>
    </div>
</div>

<script>
const uploadForm = document.getElementById("uploadForm");
const uploadProgressWrapper = document.getElementById("uploadProgressWrapper");
const uploadProgress = document.getElementById("uploadProgress");
const uploadBtn = document.getElementById("uploadBtn");
const cancelBtn = document.getElementById("cancelBtn");
const errorTableWrapper = document.getElementById("errorTableWrapper");
const lastUploadInfo = document.getElementById("lastUploadInfo");
const uploadStats = document.getElementById("uploadStats");
const mergeSummaryCard = document.getElementById("mergeSummaryCard");
const mergeSummaryStats = document.getElementById("mergeSummaryStats");
const mergeSummaryExtra = document.getElementById("mergeSummaryExtra");

let intervalId = null;
let currentTaskId = null;
let pendingCount = 0;         // counts consecutive PENDING polls
const MAX_PENDING_POLLS = 8; // 8 × 2s = 16s timeout

function statCard(label, value, color) {
    return `
        <div class="col-6 col-md-3">
            <div class="border rounded p-3 h-100">
                <div class="fs-2 fw-bold text-${color}">${value}</div>
                <div class="text-muted small">${label}</div>
            </div>
        </div>`;
}

function showMergeSummary(data) {
    mergeSummaryCard.style.display = "block";

    const s = data.merge_summary || {};
    const edcs = data.total_edcs_records || 0;
    const tblis = data.total_tblis_records || 0;
    const pct = data.percentage_uploaded || 0;
    const dateFrom = data.tblis_date_from || "—";
    const dateTo   = data.tblis_date_to   || "—";

    mergeSummaryStats.innerHTML =
        statCard("Total Rows in File", s.total_zonal_records ?? data.total ?? "—", "primary") +
        statCard("✅ Created", s.created ?? data.created ?? "—", "success") +
        statCard("🔄 Updated", s.updated ?? data.updated ?? "—", "info") +
        statCard("❌ Errors", s.errors ?? (data.errors ? data.errors.length : 0), "danger");

    mergeSummaryExtra.innerHTML = `
        <table class="table table-sm table-bordered mb-0">
            <tbody>
                <tr><th class="w-50">Total EDCS Records (DB)</th><td>${edcs.toLocaleString()}</td></tr>
                <tr><th>Total TBLIS Records (DB)</th><td>${tblis.toLocaleString()}</td></tr>
                <tr><th>Coverage</th><td><strong>${pct}%</strong></td></tr>
                <tr>
                    <th>📅 TBLIS Data Range</th>
                    <td><strong>${dateFrom}</strong> → <strong>${dateTo}</strong></td>
                </tr>
            </tbody>
        </table>`;
}

uploadForm.addEventListener("submit", function(e){
    e.preventDefault();

    uploadBtn.disabled = true;
    uploadBtn.innerText = "Uploading...";
    cancelBtn.style.display = "inline-block";
    errorTableWrapper.innerHTML = "";
    mergeSummaryCard.style.display = "none";

    const xhr = new XMLHttpRequest();
    const formData = new FormData(this);

    xhr.upload.addEventListener("progress", function(event){
        if(event.lengthComputable){
            let percent = Math.round((event.loaded / event.total) * 100);
            uploadProgressWrapper.style.display = "block";
            uploadProgress.style.width = percent + "%";
            uploadProgress.innerText = percent + "%";
            uploadProgress.classList.add("uploading");
            uploadProgress.classList.remove("processing");
        }
    });

    xhr.open("POST", "", true);

    xhr.onload = function(){
        let data;
        try {
            data = JSON.parse(xhr.responseText);
        } catch(e) {
            errorTableWrapper.innerHTML = `<div class="alert alert-danger">Server error: ${xhr.responseText}</div>`;
            uploadBtn.disabled = false;
            uploadBtn.innerText = "Upload CSV";
            cancelBtn.style.display = "none";
            return;
        }

        if (!data.task_id) {
            errorTableWrapper.innerHTML = `<div class="alert alert-danger">Upload failed — no task ID returned.<br>${JSON.stringify(data)}</div>`;
            uploadBtn.disabled = false;
            uploadBtn.innerText = "Upload CSV";
            cancelBtn.style.display = "none";
            return;
        }

        currentTaskId = data.task_id;
        pendingCount = 0;
        const TASK_URL = "{% url 'nanopore:task-status' 'TASKID' %}".replace("TASKID", currentTaskId);

        // --- Poll for server-side processing ---
        intervalId = setInterval(()=>{
            fetch(TASK_URL)
                .then(r => r.json())
                .then(data => {
                    if(data.state === "PENDING"){
                        pendingCount++;
                        if(pendingCount >= MAX_PENDING_POLLS){
                            clearInterval(intervalId);
                            uploadBtn.disabled = false;
                            uploadBtn.innerText = "Upload CSV";
                            cancelBtn.style.display = "none";
                            uploadProgressWrapper.style.display = "none";
                            errorTableWrapper.innerHTML = `
                                <div class="alert alert-warning">
                                    <strong>⚠ Celery worker is not running.</strong><br>
                                    The file was uploaded but the background import task is not being processed.
                                    Please start the Celery worker and try again:<br>
                                    <code>celery -A src worker -l info</code>
                                </div>`;
                        }
                        return; // still waiting
                    }

                    pendingCount = 0; // reset once task starts

                    if(data.current && data.total){
                        let pct = Math.round((data.current / data.total) * 100);
                        uploadProgressWrapper.style.display = "block";
                        uploadProgress.style.width = pct + "%";
                        uploadProgress.innerText = pct + "%";
                        uploadProgress.classList.remove("uploading");
                        uploadProgress.classList.add("processing");
                    }

                    if(data.state === "FAILURE"){
                        clearInterval(intervalId);
                        uploadBtn.disabled = false;
                        uploadBtn.innerText = "Upload CSV";
                        cancelBtn.style.display = "none";
                        uploadProgressWrapper.style.display = "none";
                        errorTableWrapper.innerHTML = `
                            <div class="alert alert-danger">
                                <strong>Import task failed:</strong><br>${data.error || 'Unknown error'}
                            </div>`;
                        return;
                    }

                    if(data.state === "SUCCESS" || data.state === "REVOKED"){
                        clearInterval(intervalId);
                        uploadBtn.disabled = false;
                        cancelBtn.style.display = "none";
                        uploadProgressWrapper.style.display = "none";

                        // Rename button if errors exist
                        if(data.errors && data.errors.length){
                            uploadBtn.innerText = "Re-upload CSV";
                        } else {
                            uploadBtn.innerText = "Upload CSV";
                        }

                        // Show last upload info
                        let now = new Date();
                        lastUploadInfo.innerHTML = `
                            <strong>Last Upload:</strong> ${now.toLocaleString()}
                        `;

                        if(data.state === "REVOKED"){
                            errorTableWrapper.innerHTML = `
                                <div class="alert alert-warning">Upload cancelled by user.</div>
                            `;
                            return;
                        }

                        // Show merge summary card
                        showMergeSummary(data);

                        // Show row errors
                        if(data.errors && data.errors.length){
                            let html = `
                                <div class="alert alert-danger mt-3">
                                    <h5>Row Errors (${data.errors.length})</h5>
                                    <table class="table table-sm table-bordered">
                                        <thead><tr><th>#</th><th>Error</th></tr></thead>
                                        <tbody>
                            `;
                            data.errors.forEach((e,i)=>{
                                html += `<tr><td>${i+1}</td><td>${e}</td></tr>`;
                            });
                            html += "</tbody></table></div>";
                            errorTableWrapper.innerHTML = html;
                        } else {
                            errorTableWrapper.innerHTML = `
                                <div class="alert alert-success mt-2">
                                    ✅ Import complete — ${data.created} created / ${data.updated} updated
                                </div>
                            `;
                        }
                    }
                })
        }, 2000);
    };

    xhr.send(formData);
});

// Cancel button
cancelBtn.addEventListener("click", function(){
    if(currentTaskId){
        fetch("{% url 'nanopore:task-revoke' 'TASKID' %}".replace("TASKID", currentTaskId), {method:"POST"})
            .then(()=> {
                clearInterval(intervalId);
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Upload CSV";
                cancelBtn.style.display = "none";
                uploadProgressWrapper.style.display = "none";
                errorTableWrapper.innerHTML = `
                    <div class="alert alert-warning">Upload cancelled by user.</div>
                `;
            });
    }
});
</script>

<style>
#uploadProgress.uploading { background-color: #0d6efd; } /* blue upload */
#uploadProgress.processing { background-color: #198754; } /* green processing */
#mergeSummaryCard { border-top: 3px solid #0d6efd; }
</style>

{% endblock %}

<form method="get" class="row g-3 mb-4">
    <div class="col-md-4">
        <label for="zone" class="form-label">Zone</label>
        <select name="zone" id="zone" class="form-select">
            <option value="">All Zones</option>
            {% for z in zones %}
                <option value="{{ z.id }}" {% if request.GET.zone == z.id|stringformat:"s" %}selected{% endif %}>{{ z.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="site" class="form-label">Site</label>
        <select name="site" id="site" class="form-select">
            <option value="">All Sites</option>
            {% for s in sites %}
                <option value="{{ s.id }}" {% if request.GET.site == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label for="pid" class="form-label">PID</label>
        <input type="text" name="pid" id="pid" value="{{ request.GET.pid }}" class="form-control" placeholder="Enter PID">
    </div>
    <div class="col-md-4">
        <label for="unique_lab_no" class="form-label">Lab No.</label>
        <input type="text" name="unique_lab_no" id="unique_lab_no" value="{{ request.GET.unique_lab_no }}" class="form-control" placeholder="Enter lab no.">
    </div>
    <div class="col-md-4">
        <label for="start_date" class="form-label">Start Date</label>
        <input type="date" name="start_date" id="start_date" value="{{ request.GET.start_date }}" class="form-control">
    </div>
    <div class="col-md-4">
        <label for="end_date" class="form-label">End Date</label>
        <input type="date" name="end_date" id="end_date" value="{{ request.GET.end_date }}" class="form-control">
    </div>
    <div class="col-md-12 text-end mt-2">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="{{ request.path }}" class="btn btn-secondary">Reset</a>
    </div>
</form>

{% extends 'base.html' %}
{% block content %}
<h2>Site: {{ object.name }}</h2>

<p>District: <a href="{% url 'locations:district-detail' district.id %}">{{ district.name }}</a></p>

<a href="{% url 'locations:district-detail' district.id %}">← Back to {{ district.name }}</a>
{% endblock %}

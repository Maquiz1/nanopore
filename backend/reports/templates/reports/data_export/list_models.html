{% extends 'base.html' %}

{% block content %}
<h2>Available Models for Export</h2>

<!-- Link to download all models CSV -->
<p>
    <a href="{% url 'reports:download_raw_data_all_models' %}" class="btn btn-warning mb-3">
        Download All Models CSV
    </a>
</p>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Model Name</th>
            <th>Description</th>
            <th>Records</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for model in models_list %}
        <tr>
            <td>{{ model.name }}</td>
            <td>{{ model.description }}</td>
            <td><span class="badge bg-secondary">{{ model.count }}</span></td>
            <td>
                <!-- Raw Data -->
                <a href="{{ model.download_url }}" class="btn btn-primary btn-sm mb-1">Raw Data</a>

                <!-- Labels Only -->
                <!-- <a href="{{ model.labels_url }}" class="btn btn-success btn-sm mb-1">Labels Only</a> -->

                <!-- Fields Only -->
                <!-- <a href="{{ model.fields_url }}" class="btn btn-info btn-sm mb-1">Fields Only</a> -->

                <!-- Data Dictionary -->
                <!-- <a href="{{ model.fields_url }}" class="btn btn-info btn-sm mb-1">Data Dictionary</a> -->
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

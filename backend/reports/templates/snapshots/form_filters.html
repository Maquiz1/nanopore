<form method="get" class="row g-3 mb-4">

    <div class="col-md-4">
        <label class="form-label">Zone</label>

        <select name="zone" class="form-select">

            <option value="">All Zones</option>

            {% for z in zones %}
            <option value="{{ z.id }}" {% if filters.zone == z.id|stringformat:"s" %}selected{% endif %}>
                {{ z.name }}
            </option>
            {% endfor %}

        </select>
    </div>


    <div class="col-md-4">
        <label class="form-label">Site</label>

        <select name="site" class="form-select">

            <option value="">All Sites</option>

            {% for s in sites %}
            <option value="{{ s.id }}" {% if filters.site == s.id|stringformat:"s" %}selected{% endif %}>
                {{ s.name }}
            </option>
            {% endfor %}

        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Form</label>

        <select name="form" class="form-select">

            <option value="">All Forms</option>

            <option value="screening" {% if filters.form == "screening" %}selected{% endif %}>Screening</option>
            <option value="enrollment" {% if filters.form == "enrollment" %}selected{% endif %}>Enrollment</option>
            <option value="clinic" {% if filters.form == "clinic" %}selected{% endif %}>Clinic</option>
            <option value="diagnosis" {% if filters.form == "diagnosis" %}selected{% endif %}>Diagnosis</option>
            <option value="regimen" {% if filters.form == "regimen" %}selected{% endif %}>Regimen</option>
            <option value="zonal" {% if filters.form == "zonal" %}selected{% endif %}>Zonal Lab</option>

        </select>
    </div>

    <div class="col-md-4">
        <label class="form-label">Start Date</label>

        <input type="date" name="start_date" class="form-control" value="{{ filters.start_date|default_if_none:'' }}">

    </div>


    <div class="col-md-4">
        <label class="form-label">End Date</label>

        <input type="date" name="end_date" class="form-control" value="{{ filters.end_date|default_if_none:'' }}">

    </div>


    <div class="col-md-4 d-flex align-items-end">

        <button type="submit" class="btn btn-primary">
            Apply Filters
        </button>

        <a href="" class="btn btn-secondary">
            Reset
        </a>

    </div>

</form>

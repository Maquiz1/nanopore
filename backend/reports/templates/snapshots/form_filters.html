    <form method="get" class="row g-3 mb-4">

        <div class="col-md-3">
            <label class="form-label">Zone</label>

            <select name="zone" class="form-select">

                <option value="">All Zones</option>

                {% for z in zones %}
                <option value="{{ z.id }}" {% if filters.zone == z.id|stringformat:"s" %}selected{% endif %}>
                    {{ z.name }}
                </option>
                {% endfor %}

            </select>
        </div>


        <div class="col-md-3">
            <label class="form-label">Site</label>

            <select name="site" class="form-select">

                <option value="">All Sites</option>

                {% for s in sites %}
                <option value="{{ s.id }}" {% if filters.site == s.id|stringformat:"s" %}selected{% endif %}>
                    {{ s.name }}
                </option>
                {% endfor %}

            </select>
        </div>


        <div class="col-md-3">
            <label class="form-label">Start Date</label>

            <input type="date" name="start_date" class="form-control"
                value="{{ filters.start_date|default_if_none:'' }}">

        </div>


        <div class="col-md-3">
            <label class="form-label">End Date</label>

            <input type="date" name="end_date" class="form-control" value="{{ filters.end_date|default_if_none:'' }}">

        </div>


        <div class="col-md-12">

            <button type="submit" class="btn btn-primary">
                Apply Filters
            </button>

            <a href="" class="btn btn-secondary">
                Reset
            </a>

        </div>

    </form>

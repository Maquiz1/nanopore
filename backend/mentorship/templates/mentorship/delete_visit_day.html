{% extends 'base.html' %}
{% block content %}
<h2>Delete Visit Day: {{ visit_day.date }}</h2>
<form method="post">
  {% csrf_token %}
  <p>Are you sure you want to delete this day?</p>
  <button type="submit">Yes, delete</button>
  <a href="{% url 'visit-detail' visit_day.visit.id %}">Cancel</a>
</form>
{% endblock %}

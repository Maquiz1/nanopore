{% extends 'base.html' %}
{% block content %}
<h2>Confirm Delete Visit</h2>
<p>Are you sure you want to delete this visit by {{ object.mentor }} to {{ object.site }} from {{ object.start_date }} to {{ object.end_date }}?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
  <a href="{% url 'visit_detail' object.id %}">Cancel</a>
</form>
{% endblock %}

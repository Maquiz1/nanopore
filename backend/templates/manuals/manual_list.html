{% extends 'base.html' %}

{% block content %}
<h2>User Manuals</h2>
<ul>
  {% for manual in manuals %}
    <li>
      {{ manual.title }} —
      {% if manual.file %}
        <a href="{{ manual.file.url }}" target="_blank">Download</a>
      {% else %}
        <span class="text-danger">No file uploaded</span>
      {% endif %}
    </li>
  {% empty %}
    <li>No manuals available.</li>
  {% endfor %}
</ul>
{% endblock %}

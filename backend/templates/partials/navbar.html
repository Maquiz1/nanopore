<div class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #003366; color: white; border-bottom: 2px solid #002244;">
    <!-- Left side: toggle + title -->
    <div style="display: flex; align-items: center;">
        <button class="toggle-btn" onclick="toggleSidebar()" 
                style="margin-right: 15px; background: none; border: none; color: white; cursor: pointer; font-size: 1.4rem;">
            <i class="fas fa-bars"></i>
        </button>

        <strong style="font-size: 1.25rem; letter-spacing: 0.5px;">
            DREAM FUND - NANOPORE TB SEQUENCING DATABASE (TANZANIA)
        </strong>
    </div>

    <!-- Right side: icons + profile dropdown -->
    <div style="display: flex; align-items: center; gap: 20px; position: relative;">

        <!-- Notifications / Messages Icon -->
        <a href="{% url 'reports:data_quality_report' %}" style="color: white; font-size: 1.2rem; position: relative;">
            <i class="fas fa-envelope"></i>
            <span class="badge" style="position: absolute; top: -5px; right: -10px; background: red; color: white; border-radius: 50%; font-size: 0.7rem; padding: 2px 5px;">3</span>
        </a>

        <!-- Alerts Icon -->
        <a href="{% url 'reports:data_quality_report' %}" style="color: white; font-size: 1.2rem; position: relative;">
            <i class="fas fa-bell"></i>
            <span class="badge" style="position: absolute; top: -5px; right: -10px; background: red; color: white; border-radius: 50%; font-size: 0.7rem; padding: 2px 5px;">5</span>
        </a>

        <!-- Profile Dropdown -->
        {% if user.is_authenticated %}
        <div class="dropdown" style="position: relative;">
            <button class="btn-profile" style="background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                <i class="fas fa-user-circle" style="font-size: 1.4rem;"></i>
                <i class="fas fa-chevron-down" style="font-size: 0.8rem;"></i>
            </button>
            <div class="dropdown-menu" style="display: none; position: absolute; right: 0; background: white; color: black; border-radius: 5px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.3); min-width: 150px;">
                <a href="{% url 'users:profile' user.id %}" style="display: block; padding: 10px 15px; text-decoration: none; color: black;">Profile</a>
                <a href="{% url 'users:logout' %}" style="display: block; padding: 10px 15px; text-decoration: none; color: black;">Logout</a>
            </div>
        </div>
        {% endif %}

    </div>
</div>

<!-- Dropdown script -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const profileBtn = document.querySelector(".btn-profile");
    const dropdownMenu = document.querySelector(".dropdown-menu");

    if(profileBtn) {
        profileBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", function() {
            dropdownMenu.style.display = "none";
        });
    }
});
</script>

{% load humanize %}
<div class="navbar"
    style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #003366; color: white; border-bottom: 2px solid #002244;">
    <!-- Left side: toggle + title -->
    <div style="display: flex; align-items: center;">
        <button class="toggle-btn" onclick="toggleSidebar()"
            style="margin-right: 15px; background: none; border: none; color: white; cursor: pointer; font-size: 1.4rem;">
            <i class="fas fa-bars"></i>
        </button>

        <strong style="font-size: 1.25rem; letter-spacing: 0.5px;">
            DREAM FUND - NANOPORE TB SEQUENCING DATABASE (TANZANIA)
        </strong>
    </div>

    <!-- Right side: icons + profile dropdown -->
    <div style="display: flex; align-items: center; gap: 20px; position: relative;">

        <!-- Notifications / Messages Icon -->
        <a href="{% url 'reports:all_queries_overview' %}" class="icon-btn">
            <i class="fas fa-envelope"></i>
            {% if total_issues %}
            <span class="badge">
                {{ total_issues   | intcomma }}
            </span>
            {% endif %}
        </a>

        <!-- Alerts Icon -->
        <!-- <a href="{% url 'reports:all_queries_overview' %}" class="icon-btn">
            <i class="fas fa-bell"></i>
            {% if total_issues %}
            <span class="badge">
                {{ total_issues   | intcomma }}
            </span>
            {% endif %}
         </a> -->

        <!-- Profile Dropdown -->
        {% if user.is_authenticated %}
        <div class="dropdown">
            <button class="btn-profile">
                <i class="fas fa-user-circle"></i>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="dropdown-menu">
                <a href="{% url 'users:profile' user.id %}">Profile</a>
                <a href="{% url 'users:logout' %}">Logout</a>
            </div>
        </div>
        {% endif %}
    </div>
</div>

<!-- CSS -->
<style>
    .icon-btn {
        position: relative;
        color: white;
        font-size: 1.2rem;
        text-decoration: none;
    }

    .icon-btn .badge {
        position: absolute;
        top: -5px;
        right: -10px;
        background: red;
        color: white;
        border-radius: 50%;
        font-size: 0.7rem;
        padding: 2px 5px;
    }

    /* Profile dropdown */
    .dropdown {
        position: relative;
    }

    .btn-profile {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 1.2rem;
    }

    .dropdown-menu {
        display: none;
        position: absolute;
        right: 0;
        background: white;
        color: black;
        border-radius: 5px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        min-width: 150px;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .dropdown-menu a {
        display: block;
        padding: 10px 15px;
        text-decoration: none;
        color: black;
    }

    .dropdown-menu a:hover {
        background-color: #f0f0f0;
    }

    /* Show dropdown on hover */
    .dropdown:hover .dropdown-menu {
        display: block;
        opacity: 1;
        transform: translateY(0);
    }
</style>

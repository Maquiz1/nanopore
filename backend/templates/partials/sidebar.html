<!-- templates/partials/sidebar.html -->
<style>
    .sidebar {
        width: 220px;
        background-color: #2c3e50;
        padding: 20px;
        color: #ecf0f1;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        transition: width 0.3s;
    }

    .sidebar.collapsed {
        width: 60px;
        padding: 20px 10px;
    }

    .sidebar h2 {
        font-size: 20px;
        margin-bottom: 20px;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
    }

    .sidebar.collapsed h2 {
        font-size: 0;
    }

    .sidebar a {
        color: #ecf0f1;
        text-decoration: none;
        padding: 10px 5px;
        margin-bottom: 8px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        white-space: nowrap;
    }

    .sidebar a i {
        margin-right: 10px;
    }

    .sidebar.collapsed a span {
        display: none;
    }

    .sidebar a:hover {
        background-color: #34495e;
    }
</style>

<div class="sidebar" id="sidebar">
    <h2>📘 LogBook</h2>
    <a href="{% url 'dashboard:dashboard' %}"><i class="fas fa-home"></i><span> Dashboard</span></a>
    <a href="{% url 'locations:country-list' %}"><i class="fas fa-globe-africa"></i><span> Countries</span></a>
    <a href="{% url 'clinical:disease-list' %}"><i class="fas fa-virus"></i><span> Diseases</span></a>
    <a href="{% url 'mentorship:visit_list' %}"><i class="fas fa-calendar-alt"></i><span> Visits</span></a>
    <a href="{% url 'reports:index' %}"><i class="fas fa-chart-line"></i><span> Reports</span></a>

    {% if user.is_authenticated %}
        <a href="{% url 'users:logout' %}"><i class="fas fa-sign-out-alt"></i><span> Logout</span></a>
    {% else %}
        <a href="{% url 'users:login' %}"><i class="fas fa-sign-in-alt"></i><span> Login</span></a>
    {% endif %}
</div>

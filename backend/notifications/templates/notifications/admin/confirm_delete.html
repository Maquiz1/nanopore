{% extends "base.html" %}
{% block title %}Delete · Dream Fund - Nanopore{% endblock %}
{% block content %}
<div class="dq" style="max-width: 620px;">
    <div class="dq-card">
        <h2 class="h5 fw-bold">Delete {{ object }}?</h2>
        <p class="dq-muted">This cannot be undone.</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
            <a href="{{ list_url }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% include "reports/data_quality/date_issues/_styles.html" %}
{% endblock %}

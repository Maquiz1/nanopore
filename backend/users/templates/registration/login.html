{% extends "base.html" %}
{% block title %}Login - My Site{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
    <h2 class="text-center mb-4">Login</h2>
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <div class="mt-3 text-center">
        <a href="{% url 'users:password_reset' %}">Forgot your password?</a><br>
        <!-- <a href="{% url 'users:sign_up' %}">Don't have an account? Sign up</a><br> -->
        <a href="{% url 'users:resend_activation' %}">Didn't get the email? Resend activation</a>
    </div>
</div>
{% endblock %}

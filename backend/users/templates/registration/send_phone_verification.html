{% extends "base_public.html" %}
{% block content %}
<div class="card p-4 mt-5 mx-auto" style="max-width: 400px;">
    <h3 class="mb-4 text-center">Enter your phone number</h3>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="phone_number" class="form-control mb-3" placeholder="+2557XXXXXXXX" required />
        <button type="submit" class="btn btn-primary w-100">Send Verification Code</button>
    </form>
</div>
{% endblock %}

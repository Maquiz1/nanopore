{% extends "base_public.html" %}
{% block content %}
<div class="card p-4 mt-5 mx-auto" style="max-width: 400px;">
    <h3 class="mb-4 text-center">Enter verification code</h3>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="code" class="form-control mb-3" placeholder="6-digit code" required />
        <button type="submit" class="btn btn-primary w-100">Verify</button>
    </form>
</div>
{% endblock %}

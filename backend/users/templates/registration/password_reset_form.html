{% extends "base_public.html" %}
{% block title %}Password Reset - My Site{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 mt-5 mx-auto" style="max-width: 500px;">
    <h4 class="card-title text-center mb-4">Send Password Reset Link</h4>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
    <div class="mt-3 text-center">
        <a href="{% url 'dashboard:dashboard' %}">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}

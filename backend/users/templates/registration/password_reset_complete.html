{% extends "registration/_auth_base.html" %}
{% block title %}Password changed{% endblock %}
{% block card %}

<h2>Password changed</h2>
<p class="auth-sub">Your new password is saved. Sign in with it.</p>
<a class="auth-btn d-flex align-items-center justify-content-center text-decoration-none" href="{% url 'users:login' %}">Sign in</a>
{% endblock %}

{% extends "base_public.html" %}

{% block title %}Password Reset Sent - My Site{% endblock %}

{% block content %}
<div class="card shadow-sm p-4 mt-5 mx-auto" style="max-width: 500px;">
    <h4 class="card-title text-center mb-4">Check Your Email</h4>
    <p class="text-center">
        We've emailed you instructions for resetting your password. If you don’t receive the email, please check your spam folder.
    </p>
    <div class="mt-3 text-center">
        <a href="{% url 'dashboard:dashboard' %}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}
